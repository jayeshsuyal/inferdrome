[build-system]
requires = ["setuptools>=83,<84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferdrome"
version = "0.1.0.dev0"
description = "Reproducible evidence pipeline for LLM-serving experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "rfc8785>=0.1.4,<1",
]

[project.scripts]
inferdrome = "inferdrome.cli:entrypoint"

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "build>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx2>=2.9,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "setuptools>=83,<84",
  "types-PyYAML>=6.0.12,<7",
  "uvicorn>=0.30,<1",
  "wheel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inferdrome.dashboard" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["inferdrome"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rfc8785"]
ignore_missing_imports = true
