name: Build and optionally publish fixed role images

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact lowercase 40-character reviewed-main source commit.
        required: true
        type: string
      execution_mode:
        description: Build/test only, or the separately approved fixed-repository publication mode.
        required: true
        type: choice
        options:
          - BUILD_AND_SMOKE_ONLY
          - PUBLISH_FIXED_ROLE_IMAGES
      confirmation:
        description: Explicit confirmation matching the selected execution mode.
        required: true
        type: choice
        options:
          - BUILD_AND_SMOKE_ONLY
          - PUBLISH_FIXED_ROLE_IMAGES
      expected_runner_name:
        description: Required non-sensitive alias of the one ephemeral CPU build worker.
        required: true
        type: string

# The workflow has no ambient write scope. Only the publication-mode worker job
# receives the ephemeral package token needed for the two fixed GHCR targets.
permissions: {}

concurrency:
  group: inferdrome-fixed-role-image-publication-${{ inputs.source_commit }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the exact selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manual mode, source, and worker-alias inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          MODE_CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_RUNNER_NAME: ${{ inputs.expected_runner_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "jayeshsuyal/inferdrome" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ "$EXPECTED_RUNNER_NAME" =~ ^[a-z][a-z0-9-]{2,62}$ ]]
          case "$EXECUTION_MODE:$MODE_CONFIRMATION" in
            BUILD_AND_SMOKE_ONLY:BUILD_AND_SMOKE_ONLY|PUBLISH_FIXED_ROLE_IMAGES:PUBLISH_FIXED_ROLE_IMAGES)
              ;;
            *)
              echo "execution mode and confirmation do not form an approved pair" >&2
              exit 1
              ;;
          esac

  build-and-smoke-only:
    needs: validate-dispatch
    if: ${{ inputs.execution_mode == 'BUILD_AND_SMOKE_ONLY' }}
    runs-on: [self-hosted, Linux, X64, inferdrome-role-image-cpu]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the exact selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python on the dedicated build worker
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and CPU-smoke both fixed roles on the dedicated worker
        id: build
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          EXPECTED_RUNNER_NAME: ${{ inputs.expected_runner_name }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work_root="$RUNNER_TEMP/inferdrome-role-image-publication"
          mkdir -p -- "$work_root"
          python scripts/role_image_worker_monitor.py \
            --mode "$EXECUTION_MODE" \
            --source-commit "$SOURCE_COMMIT" \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --runner-name "$RUNNER_NAME" \
            --expected-runner-name "$EXPECTED_RUNNER_NAME" \
            --runner-temp "$RUNNER_TEMP" \
            --workspace "$GITHUB_WORKSPACE" \
            --build-deadline-seconds 2550 \
            --output "$work_root/capacity-observations.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            -- bash scripts/build_role_images_and_smoke.sh \
              --source-commit "$SOURCE_COMMIT" \
              --work-root "$work_root"

      - name: Retain bounded raw worker observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inferdrome-role-image-worker-observations-${{ github.run_id }}
          path: ${{ runner.temp }}/inferdrome-role-image-publication/capacity-observations.json
          if-no-files-found: warn
          retention-days: 14

  publish-fixed-role-images:
    needs: validate-dispatch
    if: ${{ inputs.execution_mode == 'PUBLISH_FIXED_ROLE_IMAGES' }}
    runs-on: [self-hosted, Linux, X64, inferdrome-role-image-cpu]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      source_commit: ${{ steps.publish.outputs.source_commit }}
      private_engine_image: ${{ steps.publish.outputs.private_engine_image }}
      cpu_runner_observer_image: ${{ steps.publish.outputs.cpu_runner_observer_image }}
      publication_pair_sha256: ${{ steps.publish.outputs.publication_pair_sha256 }}
    steps:
      - name: Check out the exact selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python on the dedicated build worker
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and CPU-smoke both fixed roles on the dedicated worker
        id: build
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          EXPECTED_RUNNER_NAME: ${{ inputs.expected_runner_name }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work_root="$RUNNER_TEMP/inferdrome-role-image-publication"
          mkdir -p -- "$work_root"
          python scripts/role_image_worker_monitor.py \
            --mode "$EXECUTION_MODE" \
            --source-commit "$SOURCE_COMMIT" \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --runner-name "$RUNNER_NAME" \
            --expected-runner-name "$EXPECTED_RUNNER_NAME" \
            --runner-temp "$RUNNER_TEMP" \
            --workspace "$GITHUB_WORKSPACE" \
            --build-deadline-seconds 2550 \
            --output "$work_root/capacity-observations.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            -- bash scripts/build_role_images_and_smoke.sh \
              --source-commit "$SOURCE_COMMIT" \
              --work-root "$work_root"

      - name: Retain bounded raw worker observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inferdrome-role-image-worker-observations-${{ github.run_id }}
          path: ${{ runner.temp }}/inferdrome-role-image-publication/capacity-observations.json
          if-no-files-found: warn
          retention-days: 14

      - name: Push both role images and emit immutable digest outputs
        id: publish
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work_root="$RUNNER_TEMP/inferdrome-role-image-publication"
          export DOCKER_CONFIG="$work_root/docker-config"
          mkdir -p -- "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          immutable_image_for_tag() {
            local repository="$1"
            local tag="$2"
            local candidate digest matched=""
            while IFS= read -r candidate; do
              if [[ "$candidate" == "$repository@"* ]]; then
                digest="${candidate#"$repository@"}"
                if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  if [[ -n "$matched" && "$matched" != "$candidate" ]]; then
                    exit 1
                  fi
                  matched="$candidate"
                fi
              fi
            done < <(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag")
            [[ -n "$matched" ]]
            printf '%s\n' "$matched"
          }

          for role in private-engine cpu-runner-observer; do
            repository="$(cat "$work_root/$role.repository")"
            tag="$(cat "$work_root/$role.tag")"
            docker push "$tag"
            immutable_image="$(immutable_image_for_tag "$repository" "$tag")"
            python scripts/role_image_publish.py validate-registry-digest \
              --plan "$work_root/$role.plan.json" \
              --immutable-image "$immutable_image" \
              --output "$work_root/$role.digest-binding.json"
          done

          python scripts/role_image_publish.py validate-digest-pair \
            --private-engine-receipt "$work_root/private-engine.digest-binding.json" \
            --cpu-runner-observer-receipt "$work_root/cpu-runner-observer.digest-binding.json" \
            --output "$work_root/digest-pair.json"
          python - "$work_root/digest-pair.json" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          pair = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          digest = "sha256:" + __import__("hashlib").sha256(
              Path(sys.argv[1]).read_bytes()
          ).hexdigest()
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"source_commit={pair['source_commit']}\n")
              output.write(f"private_engine_image={pair['private_engine_image']}\n")
              output.write(
                  f"cpu_runner_observer_image={pair['cpu_runner_observer_image']}\n"
              )
              output.write(f"publication_pair_sha256={digest}\n")
          with Path(sys.argv[3]).open("a", encoding="utf-8") as summary:
              summary.write("## Fixed role-image publication\n\n")
              summary.write(f"- Source: `{pair['source_commit']}`\n")
              summary.write(
                  f"- Private engine: `{pair['private_engine_image']}`\n"
              )
              summary.write(
                  "- CPU runner/observer: "
                  f"`{pair['cpu_runner_observer_image']}`\n"
              )
              summary.write(f"- Validated pair: `{digest}`\n")
          PY

      - name: Retain the canonical paired-digest record
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inferdrome-role-image-digest-pair-${{ github.run_id }}
          path: ${{ runner.temp }}/inferdrome-role-image-publication/digest-pair.json
          if-no-files-found: error
          retention-days: 14
