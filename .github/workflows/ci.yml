name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_phase:
        description: "Release preflight phase"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - candidate
          - final-pre-tag
          - post-tag

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  engineering:
    name: Engineering gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install engineering dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Run repository release preflight
        env:
          RELEASE_PREFLIGHT_PHASE: ${{ inputs.release_phase || 'auto' }}
        run: >-
          python scripts/release_preflight.py
          --phase "$RELEASE_PREFLIGHT_PHASE"
          --repository-only --require-clean

      - name: Run the engineering gate
        env:
          INFERDROME_PYTHON: python
        run: ./scripts/engineering_gate.sh

  deployment-qualification:
    name: Deployment qualification gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install qualification dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Run the deployment qualification gate
        env:
          INFERDROME_PYTHON: python
          INFERDROME_QUALIFICATION_OUTPUT_ROOT: ${{ runner.temp }}/inferdrome-qualification-output
        run: ./scripts/deployment_qualification_gate.sh

      - name: Stage verified qualification report for artifact upload
        if: ${{ success() }}
        run: |
          output_root="${{ runner.temp }}/inferdrome-qualification-output"
          upload_root="${{ runner.temp }}/inferdrome-qualification-report"
          report_files=("$output_root"/*/qualification.json)
          if [[ "${#report_files[@]}" -ne 1 ]]; then
            echo "expected exactly one verified qualification report" >&2
            exit 1
          fi
          mkdir -p -- "$upload_root"
          cp -- "${report_files[0]}" "$upload_root/qualification.json"

      - name: Upload qualification report
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inferdrome-qualification-report
          if-no-files-found: error
          retention-days: 14

  dashboard:
    name: Dashboard gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dashboard dependencies
        timeout-minutes: 5
        run: python -m pip install --editable ".[dev,dashboard]"

      - name: Install frontend dependencies
        timeout-minutes: 5
        run: npm ci --prefix frontend

      # ubuntu-24.04 hosted runners already include Chromium's OS dependencies.
      # Avoid --with-deps here because its apt update depends on a flaky runner mirror.
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx --prefix frontend playwright install chromium

      - name: Run the dashboard gate
        env:
          CI: "true"
          INFERDROME_PYTHON: python
        run: ./scripts/dashboard_gate.sh

      - name: Require committed dashboard assets to be current
        run: git diff --exit-code -- src/inferdrome/dashboard/static

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-browser-failure-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
