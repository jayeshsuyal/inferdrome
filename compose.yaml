name: inferdrome-vllm

services:
  mock-engine:
    image: inferdrome/compose-mock:development
    build:
      context: .
      dockerfile: Dockerfile.compose-mock
      args:
        BUILD_FLAVOR: development
        SOURCE_REPOSITORY_COMMIT: development-unpinned
        INFERDROME_VERSION: 0.1.0.dev0
    command: ["--host", "0.0.0.0", "--port", "8000"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: "no"
    expose: ["8000"]
    networks:
      inferdrome-internal:
        aliases: ["mock-engine.internal"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read(32)",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 1s

  synthetic-smoke:
    image: inferdrome/runner:development
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_FLAVOR: development
        SOURCE_REPOSITORY_COMMIT: development-unpinned
        INFERDROME_VERSION: 0.1.0.dev0
    entrypoint: ["/opt/inferdrome-runtime/bin/inferdrome-runner-probe"]
    command:
      [
        "--endpoint",
        "http://mock-engine.internal:8000/v1/chat/completions",
        "--model",
        "inferdrome/mock-model",
        "--prompt",
        "deterministic local Compose smoke",
        "--evidence-dir",
        "/evidence",
      ]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: "no"
    depends_on:
      mock-engine:
        condition: service_healthy
    networks: [inferdrome-internal]
    tmpfs:
      - /tmp/inferdrome:rw,noexec,nosuid,size=16m
    volumes:
      - type: bind
        source: ${INFERDROME_COMPOSE_EVIDENCE_DIR:-./.inferdrome-compose/evidence}
        target: /evidence

  vllm-engine:
    profiles: [gpu]
    image: ${INFERDROME_VLLM_RUNTIME_IMAGE:-vllm/vllm-openai@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52}
    platform: linux/amd64
    command:
      [
        "/models/qwen3-8b",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--served-model-name",
        "Qwen/Qwen3-8B",
        "--tokenizer",
        "/models/qwen3-8b",
        "--tokenizer-mode",
        "auto",
        "--dtype",
        "bfloat16",
        "--seed",
        "42",
        "--load-format",
        "safetensors",
        "--generation-config",
        "vllm",
        "--model-impl",
        "vllm",
        "--max-model-len",
        "2048",
        "--gpu-memory-utilization",
        "0.90",
        "--tensor-parallel-size",
        "1",
        "--no-enable-log-requests",
        "--disable-uvicorn-access-log",
        "--uvicorn-log-level",
        "warning",
      ]
    user: "2000:0"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: "no"
    expose: ["8000"]
    networks:
      inferdrome-internal:
        aliases: ["vllm-engine.internal"]
    volumes:
      - type: bind
        source: ${INFERDROME_QWEN3_MODEL_PATH:-./.inferdrome-qwen3-8b-model}
        target: /models/qwen3-8b
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/vllm/.cache:rw,nosuid,size=512m
    shm_size: "1g"
    environment:
      HF_HOME: /home/vllm/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_CACHE_ROOT: /home/vllm/.cache/vllm
      TRITON_CACHE_DIR: /home/vllm/.cache/triton
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read(32)",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  vllm-benchmark-runner:
    profiles: [gpu]
    image: ${INFERDROME_VLLM_RUNNER_IMAGE:-inferdrome/vllm-benchmark-runner:development}
    platform: linux/amd64
    entrypoint: ["inferdrome"]
    command:
      [
        "run",
        "/inputs/experiment.yaml",
        "--runs-root",
        "/evidence/runs",
        "--tokenizer-path",
        "/models/qwen3-8b",
      ]
    user: "2000:0"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: "no"
    depends_on:
      vllm-engine:
        condition: service_healthy
    networks: [inferdrome-internal]
    volumes:
      - type: bind
        source: ${INFERDROME_EXPERIMENT_DIR:-./compose-input}
        target: /inputs
        read_only: true
      - type: bind
        source: ${INFERDROME_QWEN3_MODEL_PATH:-./.inferdrome-qwen3-8b-model}
        target: /models/qwen3-8b
        read_only: true
      - type: bind
        source: ${INFERDROME_COMPOSE_EVIDENCE_DIR:-./.inferdrome-compose/evidence}
        target: /evidence
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/vllm/.cache:rw,nosuid,size=512m
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_CACHE_ROOT: /home/vllm/.cache/vllm
      TRITON_CACHE_DIR: /home/vllm/.cache/triton

networks:
  inferdrome-internal:
    internal: true
